<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Loading - UMass Dining Wrapped</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="utf-8" />
    <link rel="icon" href="{{ url_for('static', filename='styles/imgs/UMassDiningWrapped.jpg') }}">
    <style>
      * { margin: 0; padding: 0; overflow: hidden; }
      #status {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 2rem;
        text-align: center;
        color: white;
        font: 20px "comic sans ms", sans-serif;
      }
      /* In the iPhone Shortcut's box on the GET page. */
      #boxtitle { display: none; }
      .frame, .frame body { background: #1b1236; }
      .frame #tv-screen { display: none; }
      .frame #boxtitle { display: block; padding: 16px 48px 0 16px; color: white; font: 700 16px -apple-system, sans-serif; }
      #track { height: 8px; margin-top: 10px; border-radius: 4px; background: #3a2d62; }
      #fill { width: 0; height: 100%; background: #16d0a6; transition: width .25s; }
      .frame #status { position: static; padding: 8px 16px 0; text-align: left; font: 500 14px -apple-system, sans-serif; }
    </style>
  </head>
  <body>
    <canvas id="tv-screen"></canvas>
    <div id="boxtitle">Grabbing your history<div id="track"><div id="fill"></div></div></div>
    <p id="status">Waiting for GET&hellip;</p>
    <form id="upload" method="post" action="{{ url_for('wrapped') }}" enctype="multipart/form-data" hidden>
      <input type="file" name="pdfs" multiple>
    </form>

    <script src="{{ url_for('static', filename='scripts/loading.js') }}"></script>
    <script src="{{ url_for('static', filename='scripts/history_windows.js') }}"></script>
    <script>
      const GET_ORIGIN = {{ get_origin|tojson }};
      const ROWS_URL = {{ url_for('rows')|tojson }};
      const DELAY_MS = 250;
      // The GET tab acknowledges each request straight away; no answer at all means an outdated
      // bookmark (from before it fetched what this page asks for).
      const ACK_TIMEOUT_MS = 10000;
      // After that, allow for the bookmarklet's 3 attempts of up to 20s each, plus backoff.
      const REPLY_TIMEOUT_MS = 90000;
      const statusEl = document.getElementById("status");
      const form = document.getElementById("upload");
      // The bookmarklet opens this page in a new tab; the iPhone Shortcut puts it in a box on GET.
      const IN_FRAME = !window.opener && window.parent !== window;
      const HOME = window.opener || (IN_FRAME ? window.parent : null);
      const RETRY = IN_FRAME ? "run the Shortcut again" : "click the bookmark again";

      if (IN_FRAME) document.documentElement.classList.add("frame");
      else startLoadingScreen(document.getElementById("tv-screen"), {{ url_for('static', filename='imgs/umass.png')|tojson }});

      // Splitting a full window adds to the total, so keep the bar at its furthest point.
      let furthest = 0;
      const showProgress = (done, total) => {
        if (!IN_FRAME) {
          statusEl.textContent = `Downloading your history from GET (${done}/${total})`;
          return;
        }
        statusEl.textContent = `${done} of ${total}. Keep this page open.`;
        furthest = Math.max(furthest, done / total);
        document.getElementById("fill").style.width = `${furthest * 100}%`;
      };

      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const pending = new Map();
      let nextId = 0;

      window.addEventListener("message", (event) => {
        // Only accept data from the GET tab that opened us.
        if (event.origin !== GET_ORIGIN || event.source !== HOME) return;
        const { type, id, pdf, message } = event.data || {};
        const request = pending.get(id);
        if (!request) return;
        if (type === "ack") {
          request.wait(REPLY_TIMEOUT_MS, `GET is taking too long to respond. Give it a minute and ${RETRY}.`);
          return;
        }
        request.wait(null);
        pending.delete(id);
        if (type === "pdf") request.resolve(pdf);
        else request.reject(new Error(message || "Couldn't download your history from GET."));
      });

      // Ask the GET tab to download one date window.
      const download = (w) => new Promise((resolve, reject) => {
        const id = nextId++;
        let timer;
        // (Re)start the deadline for this request; null just clears it.
        const wait = (ms, message) => {
          clearTimeout(timer);
          if (ms === null) return;
          timer = setTimeout(() => {
            pending.delete(id);
            reject(new Error(message));
          }, ms);
        };
        pending.set(id, { resolve, reject, wait });
        wait(ACK_TIMEOUT_MS, IN_FRAME
          ? "The GET page isn't answering. Run the Shortcut again."
          : "The GET tab isn't answering. Keep it open, drag the newest Dining Wrapped button from the home page to your bookmarks, and try again.");
        HOME.postMessage({ type: "fetch", id, start: HistoryWindows.fmt(w.start), end: HistoryWindows.fmt(w.end) }, GET_ORIGIN);
      });

      const isFull = async (pdf) => {
        const res = await fetch(ROWS_URL, { method: "POST", body: pdf });
        const body = await res.json();
        if (!res.ok) throw new Error(body.error);
        return body.full;
      };

      const run = async () => {
        const queue = HistoryWindows.initial(new Date());
        const pdfs = [];
        let done = 0;
        while (queue.length) {
          showProgress(done, done + queue.length);
          const w = queue.shift();
          const pdf = await download(w);
          // A full window may be missing its oldest rows, so fetch it again in halves.
          if (HistoryWindows.canSplit(w) && await isFull(pdf)) queue.unshift(...HistoryWindows.split(w));
          else pdfs.push(pdf);
          done++;
          await sleep(DELAY_MS);
        }

        statusEl.textContent = "Crunching the numbers…";
        if (IN_FRAME) {
          document.getElementById("fill").style.width = "100%";
          HOME.postMessage({ type: "done", pdfs }, GET_ORIGIN, pdfs);
          return;
        }
        const files = new DataTransfer();
        pdfs.forEach((pdf, i) => {
          files.items.add(new File([pdf], `history-${i}.pdf`, { type: "application/pdf" }));
        });
        form.elements.pdfs.files = files.files;
        form.submit();
      };

      if (HOME) {
        run().catch((err) => { statusEl.textContent = err.message; });
      } else {
        statusEl.innerHTML = 'This page opens from the bookmarklet. <a href="{{ url_for("home") }}" style="color:white">Go back</a>';
      }
    </script>
  </body>
</html>
